<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People Detector</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
    :root { --ink:#17211b; --muted:#68746c; --paper:#f5f3ed; --panel:#fffdf8; --line:#d9ded6; --green:#176b4d; --lime:#cce85b; --red:#bb5546; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0%, #dce9c7 0, transparent 32%), var(--paper); font-family:'DM Sans', sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:26px 5vw 20px; border-bottom:1px solid var(--line); }
    .brand { display:flex; gap:12px; align-items:center; font-family:'Space Grotesk', sans-serif; font-size:21px; font-weight:700; letter-spacing:0; }
    .mark { width:28px; height:28px; display:grid; place-items:center; background:var(--lime); border-radius:50%; color:var(--green); font-weight:700; }
    .live { display:flex; gap:8px; align-items:center; color:var(--green); font-weight:700; font-size:13px; }
    .dot { width:8px; height:8px; background:#38a56f; border-radius:50%; box-shadow:0 0 0 5px #d5eddd; }
    main { max-width:1400px; margin:0 auto; padding:38px 5vw 60px; }
    .intro { display:flex; justify-content:space-between; align-items:end; margin-bottom:24px; }
    h1 { font-family:'Space Grotesk', sans-serif; font-size:clamp(30px, 4vw, 58px); line-height:1; margin:0 0 10px; letter-spacing:0; }
    .sub { margin:0; color:var(--muted); }
    .actions { display:flex; gap:10px; }
    button { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:11px 15px; border-radius:5px; cursor:pointer; font:500 14px 'DM Sans'; }
    button:hover { border-color:var(--green); }
    .dashboard { display:grid; grid-template-columns:minmax(0, 1.7fr) minmax(280px, .8fr); gap:18px; }
    .camera { min-height:440px; background:#1c2922; border-radius:7px; overflow:hidden; position:relative; border:1px solid #26392d; }
    .camera img { width:100%; height:100%; min-height:440px; object-fit:cover; display:block; }
    .camera-label { position:absolute; top:18px; left:18px; padding:8px 10px; color:#fff; background:rgba(23,33,27,.75); border-radius:4px; font-size:12px; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px; min-height:150px; display:flex; flex-direction:column; justify-content:space-between; }
    .metric:first-child { background:var(--green); color:#fff; border-color:var(--green); }
    .metric small { color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:11px; }
    .metric:first-child small { color:#c7dfcf; }
    .number { font:700 48px 'Space Grotesk'; letter-spacing:0; }
    .event { grid-column:1 / -1; background:var(--ink); color:#fff; min-height:126px; }
    .event small { color:#b9c5bc; }
    .event-text { font:500 19px 'Space Grotesk'; }
    .settings { margin-top:18px; padding:16px 20px; background:rgba(255,253,248,.7); border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    label { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; }
    input { accent-color:var(--green); width:18px; height:18px; }
    @media (max-width:800px) { header { padding:20px; } main { padding:28px 20px 40px; } .intro { display:block; } .actions { margin-top:20px; } .dashboard { grid-template-columns:1fr; } .camera, .camera img { min-height:280px; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark">P</span> People Detector</div><div class="live"><span class="dot"></span> LIVE MONITORING</div></header>
  <main>
    <div class="intro"><div><h1>Room watch.</h1><p class="sub">Real-time people count and movement events.</p></div><div class="actions"><button id="reset">Reset totals</button></div></div>
    <section class="dashboard">
      <div class="camera"><img src="{{ url_for('video_feed') }}" alt="Live camera feed"><span class="camera-label">CAMERA / PEOPLE TRACKING</span></div>
      <div class="metrics">
        <div class="metric"><small>In frame now</small><div class="number" id="occupancy">0</div></div>
        <div class="metric"><small>Total entries</small><div class="number" id="entries">0</div></div>
        <div class="metric"><small>Total exits</small><div class="number" id="exits">0</div></div>
        <div class="metric"><small>Frame rate</small><div class="number"><span id="fps">0</span><small> FPS</small></div></div>
        <div class="metric event"><small>Latest event</small><div class="event-text" id="event">Waiting for movement...</div></div>
      </div>
    </section>
    <div class="settings"><label><input type="checkbox" id="sound" checked> Audio alerts</label><span class="sub">Entry tones are bright; exit tones are lower.</span></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    async function refresh() {
      try {
        const data = await fetch('/api/status').then(r => r.json());
        $('occupancy').textContent = data.occupancy;
        $('entries').textContent = data.entries;
        $('exits').textContent = data.exits;
        $('fps').textContent = data.fps;
        $('sound').checked = data.sound_enabled;
        if (data.last_event) $('event').textContent = `${data.last_event.type.toUpperCase()} · ${data.last_event.count} person(s) · ${data.last_event_time}`;
      } catch (error) { $('event').textContent = 'Camera connection unavailable'; }
    }
    $('reset').onclick = () => fetch('/api/reset', { method:'POST' }).then(refresh);
    $('sound').onchange = (event) => fetch('/api/sound', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:event.target.checked}) });
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
